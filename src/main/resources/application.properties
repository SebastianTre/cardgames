spring.application.name=cardgames

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cardgames}
spring.datasource.username=${DB_USER:XOXOXyourName}
spring.datasource.password=${DB_PASSWORD:XOXOXchooseSafePasswords}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

jwt.secret=cardgames-super-secret-key-change-this-later
jwt.expiration=86400000